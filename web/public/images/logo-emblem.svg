<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 135" fill="none">
  <defs>
    <!-- Saffron Brush Wave Gradient -->
    <linearGradient id="saffronWave" x1="12" y1="92" x2="225" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.1" />
      <stop offset="16%" stop-color="#F97316" stop-opacity="0.88" />
      <stop offset="55%" stop-color="#EA580C" />
      <stop offset="86%" stop-color="#FB923C" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#FDBA74" stop-opacity="0" />
    </linearGradient>

    <!-- Green Brush Wave Gradient -->
    <linearGradient id="greenWave" x1="20" y1="122" x2="215" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#15803D" stop-opacity="0.08" />
      <stop offset="18%" stop-color="#15803D" stop-opacity="0.92" />
      <stop offset="55%" stop-color="#166534" />
      <stop offset="88%" stop-color="#22C55E" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#4ADE80" stop-opacity="0" />
    </linearGradient>

    <!-- White Middle Ribbon Highlight -->
    <linearGradient id="whiteWave" x1="20" y1="106" x2="220" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0.96" />
      <stop offset="75%" stop-color="#FFFFFF" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Clip Path so the Ashoka Chakra rises naturally from behind the Tricolor wave -->
    <clipPath id="chakraRiseClip">
      <path d="M 0 0 H 240 V 82 C 185 95, 130 68, 70 76 C 35 80, 12 92, 0 98 Z" />
    </clipPath>
  </defs>

  <!-- Official 24-Spoke Ashoka Chakra (Navy Blue #0F2F76) -->
  <g clip-path="url(#chakraRiseClip)" transform="translate(152, 54)">
    <!-- Outer Rim -->
    <circle cx="0" cy="0" r="42" stroke="#0F2F76" stroke-width="5.2" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="36.2" stroke="#0F2F76" stroke-width="1" fill="none" />
    <!-- Center Hub -->
    <circle cx="0" cy="0" r="8.2" fill="#0F2F76" />
    <circle cx="0" cy="0" r="3.4" fill="#FFFFFF" />

    <!-- 24 Tapered Spokes & 24 Rim Crescents (Every 15 Degrees) -->
    <g fill="#0F2F76" stroke="#0F2F76">
      <g transform="rotate(0)"><polygon points="0,-8 1.5,-22 0,-36 -1.5,-22" /><circle cx="9.6" cy="-35.8" r="2.3" /></g>
      <g transform="rotate(15)"><polygon points="0,-8 1.5,-22 0,-36 -1.5,-22" /><circle cx="9.6" cy="-35.8" r="2.3" /></g>
      <g transform="rotate(30)"><polygon points="0,-8 1.5,-22 0,-36 -1.5,-22" /><circle cx="9.6" cy="-35.8" r="2.3" /></g>
      <g transform="rotate(45)"><polygon points="0,-8 1.5,-22 0,-36 -1.5,-22" /><circle cx="9.6" cy="-35.8" r="2.3" /></g>
      <g transform="rotate(60)"><polygon points="0,-8 1.5,-22 0,-36 -1.5,-22" /><circle cx="9.6" cy="-35.8" r="2.3" /></g>
      <g transform="rotate(75)"><polygon points="0,-8 1.5,-22 0,-36 -1.5,-22" /><circle cx="9.6" cy="-35.8" r="2.3" /></g>
      <g transform="rotate(90)"><polygon points="0,-8 1.5,-22 0,-36 -1.5,-22" /><circle cx="9.6" cy="-35.8" r="2.3" /></g>
      <g transform="rotate(105)"><polygon points="0,-8 1.5,-22 0,-36 -1.5,-22" /><circle cx="9.6" cy="-35.8" r="2.3" /></g>
      <g transform="rotate(120)"><polygon points="0,-8 1.5,-22 0,-36 -1.5,-22" /><circle cx="9.6" cy="-35.8" r="2.3" /></g>
      <g transform="rotate(135)"><polygon points="0,-8 1.5,-22 0,-36 -1.5,-22" /><circle cx="9.6" cy="-35.8" r="2.3" /></g>
      <g transform="rotate(150)"><polygon points="0,-8 1.5,-22 0,-36 -1.5,-22" /><circle cx="9.6" cy="-35.8" r="2.3" /></g>
      <g transform="rotate(165)"><polygon points="0,-8 1.5,-22 0,-36 -1.5,-22" /><circle cx="9.6" cy="-35.8" r="2.3" /></g>
      <g transform="rotate(180)"><polygon points="0,-8 1.5,-22 0,-36 -1.5,-22" /><circle cx="9.6" cy="-35.8" r="2.3" /></g>
      <g transform="rotate(195)"><polygon points="0,-8 1.5,-22 0,-36 -1.5,-22" /><circle cx="9.6" cy="-35.8" r="2.3" /></g>
      <g transform="rotate(210)"><polygon points="0,-8 1.5,-22 0,-36 -1.5,-22" /><circle cx="9.6" cy="-35.8" r="2.3" /></g>
      <g transform="rotate(225)"><polygon points="0,-8 1.5,-22 0,-36 -1.5,-22" /><circle cx="9.6" cy="-35.8" r="2.3" /></g>
      <g transform="rotate(240)"><polygon points="0,-8 1.5,-22 0,-36 -1.5,-22" /><circle cx="9.6" cy="-35.8" r="2.3" /></g>
      <g transform="rotate(255)"><polygon points="0,-8 1.5,-22 0,-36 -1.5,-22" /><circle cx="9.6" cy="-35.8" r="2.3" /></g>
      <g transform="rotate(270)"><polygon points="0,-8 1.5,-22 0,-36 -1.5,-22" /><circle cx="9.6" cy="-35.8" r="2.3" /></g>
      <g transform="rotate(285)"><polygon points="0,-8 1.5,-22 0,-36 -1.5,-22" /><circle cx="9.6" cy="-35.8" r="2.3" /></g>
      <g transform="rotate(300)"><polygon points="0,-8 1.5,-22 0,-36 -1.5,-22" /><circle cx="9.6" cy="-35.8" r="2.3" /></g>
      <g transform="rotate(315)"><polygon points="0,-8 1.5,-22 0,-36 -1.5,-22" /><circle cx="9.6" cy="-35.8" r="2.3" /></g>
      <g transform="rotate(330)"><polygon points="0,-8 1.5,-22 0,-36 -1.5,-22" /><circle cx="9.6" cy="-35.8" r="2.3" /></g>
      <g transform="rotate(345)"><polygon points="0,-8 1.5,-22 0,-36 -1.5,-22" /><circle cx="9.6" cy="-35.8" r="2.3" /></g>
    </g>
  </g>

  <!-- Sweeping Saffron Top Wave -->
  <path
    d="M 8 104 C 48 66, 105 64, 154 78 C 186 87, 212 76, 234 52 C 212 88, 182 103, 146 93 C 102 80, 52 82, 8 104 Z"
    fill="url(#saffronWave)"
  />

  <!-- Sweeping White Middle Wave -->
  <path
    d="M 14 114 C 54 82, 108 80, 152 93 C 184 102, 210 90, 228 68 C 208 100, 180 114, 144 104 C 102 92, 56 94, 14 114 Z"
    fill="url(#whiteWave)"
  />

  <!-- Sweeping Green Bottom Wave -->
  <path
    d="M 18 126 C 62 94, 112 94, 154 106 C 184 114, 208 104, 224 82 C 204 116, 176 130, 140 120 C 100 108, 56 108, 18 126 Z"
    fill="url(#greenWave)"
  />
</svg>
